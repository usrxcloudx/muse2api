services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    env_file:
      - .env
    environment:
      - MUSE2API_KEY=${MUSE2API_KEY}
      - MUSE2API_PUBLIC_BASE=${MUSE2API_PUBLIC_BASE:-}
      - MUSE2API_IMAGE_TIMEOUT=${MUSE2API_IMAGE_TIMEOUT:-240}
      - MUSE2API_VIDEO_TIMEOUT=${MUSE2API_VIDEO_TIMEOUT:-600}
      - MUSE2API_CHAT_TIMEOUT=${MUSE2API_CHAT_TIMEOUT:-300}
      - MUSE2API_HOST_MEDIA_DIR=${MUSE2API_HOST_MEDIA_DIR:-}
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
      - ./admin.html:/app/admin.html:ro
      - ./app.py:/app/app.py:ro
      - ./engine.py:/app/engine.py:ro
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
